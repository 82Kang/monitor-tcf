name: watch-tcf

on:
  schedule:
    # Every 5 minutes, deliberately OFF the round boundaries.
    #
    # '*/5' fires at :00 :05 :10 ... which is exactly when every other */5 and
    # hourly job on GitHub fires. Scheduled runs are best-effort, and under that
    # load GitHub does not delay them - it SKIPS them silently, with no run and
    # no error. Measured on this repo: '*/5' produced 1 run in 8.5 hours.
    #
    # Landing at :03 :08 :13 ... keeps the same cadence while missing the
    # stampede. Still best-effort; still expect gaps.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so a delayed burst of queued schedules cannot race on the
# state.json commit.
concurrency:
  group: watch-tcf
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check for open seats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py

      - name: Persist state if it changed
        run: |
          if git diff --quiet -- state.json; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u '+%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing"
            git pull --rebase --autostash
          done
          echo "could not push state after 3 attempts" >&2
          exit 1
